<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Financial Data Chatbot</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          Cantarell, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .chat-container {
        background: white;
        border-radius: 10px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        width: 100%;
        max-width: 800px;
        height: 600px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .chat-header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 20px;
        text-align: center;
      }

      .chat-header h1 {
        font-size: 24px;
        margin-bottom: 5px;
      }

      .connection-status {
        font-size: 12px;
        opacity: 0.9;
      }

      .status-connected {
        color: #4ade80;
      }

      .status-disconnected {
        color: #f87171;
      }

      .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        background: #f9fafb;
      }

      .message {
        margin-bottom: 15px;
        display: flex;
        animation: fadeIn 0.3s;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .message.user {
        justify-content: flex-end;
      }

      .message-content {
        max-width: 70%;
        padding: 12px 16px;
        border-radius: 10px;
        word-wrap: break-word;
      }

      .message.user .message-content {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }

      .message.assistant .message-content {
        background: white;
        border: 1px solid #e5e7eb;
        color: #1f2937;
      }

      .message.system .message-content {
        background: #fef3c7;
        color: #92400e;
        max-width: 100%;
        text-align: center;
        font-size: 13px;
      }

      .message-meta {
        font-size: 11px;
        color: #6b7280;
        margin-top: 4px;
      }

      .chat-input-container {
        padding: 20px;
        background: white;
        border-top: 1px solid #e5e7eb;
      }

      .chat-input-form {
        display: flex;
        gap: 10px;
      }

      .chat-input {
        flex: 1;
        padding: 12px 16px;
        border: 2px solid #e5e7eb;
        border-radius: 8px;
        font-size: 14px;
        outline: none;
        transition: border-color 0.2s;
      }

      .chat-input:focus {
        border-color: #667eea;
      }

      .send-button {
        padding: 12px 24px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
        transition: transform 0.2s;
      }

      .send-button:hover {
        transform: scale(1.05);
      }

      .send-button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }

      .typing-indicator {
        display: none;
        padding: 12px 16px;
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        max-width: 70px;
      }

      .typing-indicator.active {
        display: inline-block;
      }

      .typing-indicator span {
        display: inline-block;
        width: 8px;
        height: 8px;
        background: #9ca3af;
        border-radius: 50%;
        margin: 0 2px;
        animation: typing 1.4s infinite;
      }

      .typing-indicator span:nth-child(2) {
        animation-delay: 0.2s;
      }

      .typing-indicator span:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes typing {
        0%,
        60%,
        100% {
          transform: translateY(0);
        }
        30% {
          transform: translateY(-10px);
        }
      }

      .quick-queries {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }

      .quick-query-btn {
        padding: 6px 12px;
        background: #f3f4f6;
        border: 1px solid #e5e7eb;
        border-radius: 6px;
        font-size: 12px;
        cursor: pointer;
        transition: all 0.2s;
      }

      .quick-query-btn:hover {
        background: #e5e7eb;
      }
    </style>
  </head>
  <body>
    <div class="chat-container">
      <div class="chat-header">
        <h1>Financial Data Chatbot</h1>
        <div class="connection-status" id="connectionStatus">
          <span class="status-disconnected">● Disconnected</span>
        </div>
      </div>

      <div class="chat-messages" id="chatMessages">
        <div class="message system">
          <div class="message-content">
            Welcome! Ask me anything about your financial data.
          </div>
        </div>
      </div>

      <div class="chat-input-container">
        <div class="quick-queries">
          <button
            class="quick-query-btn"
            onclick="sendQuickQuery('How many IBM trades were executed?')"
          >
            IBM Trades
          </button>
          <button
            class="quick-query-btn"
            onclick="
              sendQuickQuery('Which portfolio has the best performance?')
            "
          >
            Best Portfolio
          </button>
          <button
            class="quick-query-btn"
            onclick="sendQuickQuery('Show me all bond transactions')"
          >
            Bond Transactions
          </button>
        </div>
        <form class="chat-input-form" id="chatForm">
          <input
            type="text"
            class="chat-input"
            id="messageInput"
            placeholder="Ask a question about your financial data..."
            autocomplete="off"
          />
          <button type="submit" class="send-button" id="sendButton">
            Send
          </button>
        </form>
      </div>
    </div>

    <script>
      let ws = null;
      const clientId = "web_client_" + Math.random().toString(36).substr(2, 9);
      const threadId = "web_thread_" + Date.now();

      // Connect to WebSocket
      function connect() {
        const wsUrl = `ws://localhost:8000/ws/${clientId}`;
        ws = new WebSocket(wsUrl);

        ws.onopen = () => {
          console.log("Connected to server");
          updateConnectionStatus(true);
        };

        ws.onmessage = (event) => {
          const data = JSON.parse(event.data);
          handleMessage(data);
        };

        ws.onclose = () => {
          console.log("Disconnected from server");
          updateConnectionStatus(false);
          // Attempt to reconnect after 3 seconds
          setTimeout(connect, 3000);
        };

        ws.onerror = (error) => {
          console.error("WebSocket error:", error);
        };
      }

      // Update connection status indicator
      function updateConnectionStatus(connected) {
        const statusEl = document.getElementById("connectionStatus");
        if (connected) {
          statusEl.innerHTML =
            '<span class="status-connected">● Connected</span>';
        } else {
          statusEl.innerHTML =
            '<span class="status-disconnected">● Disconnected</span>';
        }
      }

      // Handle incoming messages
      function handleMessage(data) {
        const messagesContainer = document.getElementById("chatMessages");

        if (data.type === "system") {
          addMessage("system", data.message);
        } else if (data.type === "processing") {
          showTypingIndicator();
        } else if (data.type === "response") {
          hideTypingIndicator();
          addMessage("assistant", data.response, {
            type: data.requires_rag ? "RAG" : "General",
            sources: data.num_sources,
          });
        } else if (data.type === "error") {
          hideTypingIndicator();
          addMessage("system", "Error: " + data.message);
        }
      }

      // Add message to chat
      function addMessage(role, content, meta = null) {
        const messagesContainer = document.getElementById("chatMessages");
        const messageDiv = document.createElement("div");
        messageDiv.className = `message ${role}`;

        let metaHtml = "";
        if (meta) {
          metaHtml = `<div class="message-meta">Type: ${meta.type} | Sources: ${meta.sources}</div>`;
        }

        messageDiv.innerHTML = `
                <div class="message-content">
                    ${content}
                    ${metaHtml}
                </div>
            `;

        messagesContainer.appendChild(messageDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }

      // Show typing indicator
      function showTypingIndicator() {
        const messagesContainer = document.getElementById("chatMessages");
        const indicator = document.createElement("div");
        indicator.className = "message assistant";
        indicator.id = "typingIndicator";
        indicator.innerHTML = `
                <div class="typing-indicator active">
                    <span></span><span></span><span></span>
                </div>
            `;
        messagesContainer.appendChild(indicator);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }

      // Hide typing indicator
      function hideTypingIndicator() {
        const indicator = document.getElementById("typingIndicator");
        if (indicator) {
          indicator.remove();
        }
      }

      // Send message
      function sendMessage(message) {
        if (!message.trim() || !ws || ws.readyState !== WebSocket.OPEN) {
          return;
        }

        // Add user message to chat
        addMessage("user", message);

        // Send to server
        ws.send(
          JSON.stringify({
            query: message,
            thread_id: threadId,
          }),
        );

        // Clear input
        document.getElementById("messageInput").value = "";
      }

      // Quick query handler
      function sendQuickQuery(query) {
        document.getElementById("messageInput").value = query;
        sendMessage(query);
      }

      // Form submit handler
      document.getElementById("chatForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const input = document.getElementById("messageInput");
        sendMessage(input.value);
      });

      // Connect on page load
      connect();
    </script>
  </body>
</html>
